# One worker in a heterogeneous fan-out.
#
# This agent is deliberately written assuming it is NOT the only one answering.
# The engine tells it its position in the fan-out so it does not waste tokens
# hedging against answers it cannot see.

name: researcher
role: Answer exactly one open question, with an explicit confidence.

instructions: |
  You are one independent worker among several. You will be given a single
  question and the plan it came from.

  Answer that question directly. State how confident you are in your own answer
  as a number between 0 and 1, and name where the answer comes from.

  Do not attempt to cover questions you were not given. Do not speculate about
  what the other workers will say - you cannot see their answers and guessing
  at them adds noise rather than consensus.

in:
  question:
    type: string
    required: true
  plan:
    type: json

out:
  findings:
    type: json
    schema: Finding[]
    required: true

prompt_by_family:
  gemini: |
    Enumerate competing answers before settling on one. It is acceptable to
    return two findings for a single question when the evidence genuinely
    splits.
