# The model capability registry.
#
# ILLUSTRATIVE TEMPLATE. Context windows, capabilities, and especially prices
# move constantly - verify against vendor pricing pages before trusting any
# number here for budgeting. The *shape* is the point: a model is described by
# what it can do and what it costs, never by what it should be used for.
#
# `quality` is a static prior. In M3 it is overwritten by this project's own
# eval history, which is the seam where self-tuning routing plugs in.

models:
  # ---- Anthropic -----------------------------------------------------------
  - id: anthropic/claude-opus-4-1
    label: Claude Opus 4.1
    provider: anthropic
    family: claude
    ctx: 200000
    max_out: 32000
    caps: [native_tool_calls, parallel_tool_calls, json_schema, reasoning, vision, prompt_caching]
    cost: { in: 15.00, out: 75.00 }
    latency_p50_ms: 4200
    quality: 0.94
    notes: Expensive. Reserve for work where being wrong costs more than the call.

  - id: anthropic/claude-sonnet-4-5
    label: Claude Sonnet 4.5
    provider: anthropic
    family: claude
    ctx: 200000
    max_out: 64000
    caps: [native_tool_calls, parallel_tool_calls, json_schema, reasoning, vision, prompt_caching]
    cost: { in: 3.00, out: 15.00 }
    latency_p50_ms: 2600
    quality: 0.90

  - id: anthropic/claude-haiku-4-5
