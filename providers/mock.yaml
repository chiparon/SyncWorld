# Offline synthesiser.
#
# Answers as any model, deterministically per (model, messages), and stylises
# its output by model family so that cross-model diffs are meaningful. Used
# automatically when no real credentials are present.

name: mock
kind: mock
notes: |
  Deterministic offline synthesiser. Not a language model. Its job is to make
  every mechanism in Syncw - heterogeneous binding, merge semantics, caching,
  replay, diff, escalation - exercisable without spending money or needing keys.
