# One key, many vendors. Useful when you want to swap models without touching
# credentials, and it is the easiest way to widen the candidate pool that the
# binding engine gets to choose from.

name: openrouter
kind: openai-compat
base_url: https://openrouter.ai/api/v1
api_key_env: OPENROUTER_API_KEY
timeout_ms: 240000
max_retries: 2
