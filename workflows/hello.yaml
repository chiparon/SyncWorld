# The smallest useful workflow: one node, one binding policy, no pinning.
#
# Read `bind:` as a query, not an assignment. This says "someone with a JSON
# schema mode and a large context, whichever is best" - and the answer changes
# by itself as the registry changes.

name: hello
description: Single-node smoke test. Good first run after cloning.

input:
  goal:
    type: string
    required: true
    default: Add a per-tenant rate limiter to the public API

world:
  plan:
    type: json
    merge: replace
    owner: plan
    description: The decomposition produced by the planner.

nodes:
  - id: plan
    agent: planner

    bind:
      require:
        - json_schema
        - ctx>=200k
      prefer: quality
      # Only consulted if nothing satisfies the constraints above, or if the
      # chosen model fails at runtime.
      fallback:
        - deepseek/*
        - google/*

    in:
      goal: $.input.goal

    out: [plan]
